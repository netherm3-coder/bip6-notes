name: Build notes app

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Щоденна перезбірка: preview-пакет має позначку часу, тож тримаємо його свіжим.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli@1

      # Звичайна збірка перевіряє проєкт і завантажує список пристроїв Zepp.
      - name: Build
        run: zeus build

      # Сканер «Режиму розробника» в Zepp приймає лише preview-пакети.
      - name: Build preview package
        run: node .tools/build-preview.js

      - name: Extract the Bip 6 package
        run: |
          set -euo pipefail
          ls -la dist
          ZAB="$(ls dist/*.zab | head -n1)"
          test -n "$ZAB"
          mkdir -p out unpacked
          cp "$ZAB" out/bip6-notes.zab
          unzip -o "$ZAB" -d unpacked
          ZPK="$(find unpacked -name '*.zpk' | head -n1)"
          test -n "$ZPK"
          cp "$ZPK" out/bip6-notes.zpk
          unzip -l out/bip6-notes.zpk
          unzip -p out/bip6-notes.zpk device.zip > device.zip
          unzip -l device.zip
          unzip -p device.zip app.json > app.json
          cat app.json; echo
          grep -q '"mode":"preview"' app.json

      - name: Publish to the build branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          echo "zpkd1://raw.githubusercontent.com/${GITHUB_REPOSITORY}/build/bip6-notes.zpk" > install-link.txt
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build
